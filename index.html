<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLAT Quiz</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--pri:#4f46e5;--ok:#16a34a;--bad:#dc2626;--txt:#1f2937;--mut:#6b7280}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--pri);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;flex-wrap:wrap;gap:8px}
header h1{font-size:1.1rem;margin:0}
#timer{font-size:1.4rem;font-variant-numeric:tabular-nums;font-weight:600}
#timer.warn{color:#fecaca}
main{max-width:760px;margin:20px auto;padding:0 14px}
.card{background:var(--card);border-radius:12px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 18px;background:var(--pri);color:#fff}
button.sec{background:#e5e7eb;color:var(--txt)}
button:disabled{opacity:.5;cursor:not-allowed}
.progress{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-bottom:14px}
.progress div{height:100%;background:var(--pri);transition:width .3s}
.set{background:#eef2ff;border-left:4px solid var(--pri);padding:18px 22px;border-radius:8px;margin-bottom:24px;font-size:1rem;line-height:1.7}
.set .st{display:block;font-weight:700;font-size:1.1rem;color:var(--pri);margin-bottom:8px}
.set p{margin:0 0 8px}
.set ul,.expl ul{margin:0;padding-left:22px}
.set li{margin:7px 0}
.expl li{margin:8px 0}
#qText{font-size:1.15rem;line-height:1.6;margin:0 0 18px}
.opt{font-size:1rem;margin:12px 0 !important;padding:14px 16px !important}
.card{padding:28px}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--txt);border:2px solid #d1d5db;margin:8px 0;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--pri);background:#f5f3ff}
.opt.sel{border-color:var(--pri);background:#eef2ff}
.opt.ok{border-color:var(--ok);background:#dcfce7}
.opt.bad{border-color:var(--bad);background:#fee2e2}
.nav{display:flex;justify-content:space-between;margin-top:14px;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.grid button{padding:6px 0;background:#e5e7eb;color:var(--txt);font-size:.85rem}
.grid button.done{background:#c7d2fe}
.grid button.cur{outline:2px solid var(--pri)}
.grid button.ok{background:#bbf7d0}.grid button.bad{background:#fecaca}
.center{text-align:center}
.score{font-size:3rem;font-weight:700;color:var(--pri)}
.hidden{display:none}
.mode{margin:14px 0}
.mode label{margin-right:16px}
.fb{margin-top:10px;font-weight:600}
.expl{margin-top:12px;padding:12px 14px;background:#fffbeb;border-left:4px solid #f59e0b;border-radius:6px;font-weight:400;color:var(--txt);line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>CLAT 2027 · Fractions &amp; Decimals</h1>
  <div><span id="timer">45:00</span></div>
</header>
<main>
  <section class="card center">
    <h2>New quiz coming soon</h2>
    <p>The previous questions have been removed. Send the new questions when you're ready, and I'll add them here.</p>
  </section>
</main>
</body>
</html>
